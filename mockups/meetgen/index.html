<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TrackIt — MeetGen expense mockup</title>
    <script>
      // Dark is what the site ships; a stored choice is put on <html> here, before
      // the first paint, so choosing light cannot flash a dark frame on the way in.
      // The key is THEME_STORAGE_KEY in src/lib/theme.ts — keep the two in step.
      try {
        var theme = localStorage.getItem("trackit-theme")
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme
      } catch (error) {
        // Private mode refuses storage; the attribute on <html> already says dark.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
