<!doctype html>
<html lang="en" data-palette="ink">
  <head>
    <meta charset="UTF-8" />
    <!--
      `maximum-scale=1, user-scalable=no` is deliberate: this is a fixed 390px phone
      layout and a pinch leaves the installed app cropped with no way back. The two
      attributes are only one of three layers — `index.css` refuses pinch with
      `touch-action`, and `src/lib/zoom.ts` cancels Safari's gesture events — because
      each browser honours a different one of them. See that module for the reasoning.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f0d" />
    <meta
      name="description"
      content="A private expense tracker: a bento dashboard and a daily ledger, kept on the device."
    />

    <!--
      Installing the app, rather than merely visiting it.

      The manifest is what makes the site installable off Safari's Share sheet (and
      Chrome's install prompt) — it carries the name, the standalone display, the
      theme and the icons. Its `start_url`, `scope` and every `src` are relative,
      which is deliberate: the same file has to work at the repository's Pages
      sub-path and at a domain's root, and a leading slash would pin it to one of
      them. iOS does not read the manifest for an icon, so the 180px PNG is named
      again here.

      `black-translucent` is the old app's choice and the right one for this design:
      the screens paint under the status bar themselves and already reserve the
      notch's inset (see `index.css`), so the bar may sit on top of the canvas. The
      `apple-mobile-web-app-capable` pair is stated twice because iOS still reads
      the apple spelling while the web at large has moved to the standard one.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrackIt" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
    <title>TrackIt</title>
    <script>
      // The palette the owner chose is put on <html> here, before the first paint, so a
      // remembered one cannot flash the default frame first.
      //
      // This table is the *only* copy of the register outside src/lib/theme.ts, and it
      // exists because neither the stylesheet nor the app module has run yet: the page
      // needs the palette's canvas for the browser's own chrome, and a palette the
      // stylesheet paints with. Keep the ids and canvas colours in step with PALETTES
      // there — the module is the one to edit first.
      ;(function () {
        var CANVAS = {
          ink: "#0a0f0d",
          midnight: "#080c14",
          paper: "#f8f6f2",
          parchment: "#f4efe6",
        }
        // A browser that chose a *theme* before palettes existed (trackit-theme) keeps its
        // choice: light and dark become each theme's default palette.
        var LEGACY = { dark: "ink", light: "paper" }
        try {
          var id = localStorage.getItem("trackit-palette")
          if (!CANVAS[id]) id = LEGACY[localStorage.getItem("trackit-theme")]
          if (CANVAS[id]) {
            document.documentElement.dataset.palette = id
            document.querySelector('meta[name="theme-color"]').setAttribute("content", CANVAS[id])
          }
        } catch (error) {
          // Private mode refuses storage; the attribute on <html> already says ink.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
