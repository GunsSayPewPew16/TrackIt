<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  role="img"
  aria-label="TrackIt logo"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Stylised downward spend line -->
  <polyline
    points="128,196 208,268 288,208 384,320"
    fill="none"
    stroke="#ffffff"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="128" cy="196" r="26" fill="#ffffff" />
  <circle cx="208" cy="268" r="26" fill="#ffffff" />
  <circle cx="288" cy="208" r="26" fill="#ffffff" />
  <circle cx="384" cy="320" r="26" fill="#ffffff" />
</svg>
