# Paths here are relative to this file: the Worker lives beside its config and the
# app's build output sits in app/, so the Worker serves the same build that GitHub
# Pages publishes.
name = "trackit"
main = "index.ts"
compatibility_date = "2026-10-01"

# The built app is served by the Worker; /api/* is handled first.
[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "trackit-db"
# Placeholder: works for local development. After `wrangler d1 create trackit-db`
# paste the real UUID here (or into the site's bindings when deploying).
database_id = "00000000-0000-0000-0000-000000000000"
